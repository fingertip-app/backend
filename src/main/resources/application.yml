spring:
  application:
    name: fingertip-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
  redis:
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.janginharou: DEBUG

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}
  connect-timeout-ms: 1000
  read-timeout-ms: 15000

app:
  timezone: Asia/Seoul
  qr:
    secret-key: ${QR_SECRET_KEY:janginharou-local-qr-secret-key-change-in-production}
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_UPLOAD_BASE_URL:http://localhost:8080/api/uploads}
    max-size: 10485760  # 10MB

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.eozmdmuzlhyanrwhyaqd}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: existing db schema before Spring migrations
  redis:
    host: localhost
    port: 6379
    password:

  # S3 is optional for local dev
  aws:
    s3:
      bucket: fingertip-dev
      region: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:localkey}
      secret-key: ${AWS_SECRET_ACCESS_KEY:localsecret}

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecurityKeyFor256BitEncryptionThatMustBeAtLeast32CharacterLongForHS512}
  expiration: 86400000

supabase:
  url: ${SUPABASE_URL:}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:${JWT_SECRET:ThisIsAVeryLongSecurityKeyFor256BitEncryptionThatMustBeAtLeast32CharacterLongForHS512}}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}

server:
  port: 8080
  servlet:
    context-path: /api

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: existing db schema before Spring migrations
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}

  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

supabase:
  url: ${SUPABASE_URL}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:${JWT_SECRET}}

fastapi:
  base-url: ${FASTAPI_BASE_URL}
  internal-api-key: ${INTERNAL_API_KEY}

app:
  timezone: Asia/Seoul
  qr:
    secret-key: ${QR_SECRET_KEY}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: WARN
    com.janginharou: INFO
