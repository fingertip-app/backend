spring:
  application:
    name: fingertip-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  redis:
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.janginharou: DEBUG

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api-key: local-internal-key
  connect-timeout-ms: 1000
  read-timeout-ms: 15000
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379
    password:

  # S3 is optional for local dev
  aws:
    s3:
      bucket: fingertip-dev
      region: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:localkey}
      secret-key: ${AWS_SECRET_ACCESS_KEY:localsecret}

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecurityKeyFor256BitEncryptionThatMustBeAtLeast32CharacterLongForHS512}
  expiration: 86400000

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: WARN
    com.janginharou: INFO
