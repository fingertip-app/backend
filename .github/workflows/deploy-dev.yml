name: Deploy Dev

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/fingertip-backend"
          strip_components: 2

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SUPABASE_JWT_SECRET,SUPABASE_URL
          script: |
            sudo mkdir -p /etc/fingertip-backend

            printf '%s\n' \
              "SUPABASE_JWT_SECRET=$SUPABASE_JWT_SECRET" \
              "SUPABASE_URL=$SUPABASE_URL" | sudo tee /etc/fingertip-backend/fingertip-backend.env > /dev/null

            sudo mkdir -p /etc/systemd/system/fingertip-backend.service.d
            sudo tee /etc/systemd/system/fingertip-backend.service.d/env.conf > /dev/null <<'EOF'
            [Service]
            EnvironmentFile=/etc/fingertip-backend/fingertip-backend.env
            EOF

            sudo systemctl daemon-reload
            mv /opt/fingertip-backend/*.jar /opt/fingertip-backend/app.jar
            sudo systemctl restart fingertip-backend
            sudo systemctl status fingertip-backend --no-pager
